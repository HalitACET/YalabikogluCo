# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deliberately does NOT declare a database. Render's free Postgres is deleted
# 30 days after creation (plus a 14-day grace period), which would take the
# site down a month after launch. The database lives on Neon instead, whose
# free tier suspends on volume rather than expiring on a timer, and DB_URL is
# set by hand in the Render dashboard. See website/DEPLOY.md.

services:
  - type: web
    name: yalabikoglu
    runtime: docker
    plan: free
    # Frankfurt is the closest free region to Riga and to the practice's
    # European audience.
    region: frankfurt
    rootDir: website
    dockerfilePath: ./Dockerfile
    # The app answers /up with 200 once it has booted. Render uses this to
    # decide a deploy succeeded.
    healthCheckPath: /up

    envVars:
      - key: APP_NAME
        value: "Yalabikoglu & Co."
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"

      # Generated by Render on first deploy, then kept.
      - key: APP_KEY
        generateValue: true

      # Set these in the dashboard — they are secrets or environment-specific.
      #   APP_URL              the public URL, e.g. https://yalabikoglu.onrender.com
      #   DB_URL               the Neon connection string (must include sslmode=require)
      #   ADMIN_EMAIL          admin panel login
      #   ADMIN_PASSWORD       admin panel password
      #   CONTACT_EMAIL        shown on the contact and privacy pages
      #   CONTACT_BOOKING_URL  Calendly link behind the briefing buttons
      - key: APP_URL
        sync: false
      - key: DB_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      - key: CONTACT_BOOKING_URL
        sync: false

      - key: DB_CONNECTION
        value: pgsql

      # The filesystem is ephemeral, so session, cache and queue state all go
      # to Postgres. Note this affects the ADMIN panel only — public pages are
      # registered outside the session middleware and set no cookies.
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database

      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
